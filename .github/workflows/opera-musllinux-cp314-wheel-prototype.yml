name: "F7 CP314 musllinux Rasterio native wheel PROTOTYPE (isolated only)"

on:
  push:
    branches:
      - "feature/p7-010-global-concurrency-2026-10-16"
    paths:
      - ".github/workflows/opera-musllinux-cp314-wheel-prototype.yml"
      - "scripts/ci_opera_musl_wheel_prototype.sh"
      - "scripts/probe_opera_raster_runtime.py"
      - "scripts/probe_opera_concurrent_raster.py"
      - "scripts/inventory_opera_native_wheel.py"
      - "scripts/audit_opera_native_apk_licenses.py"
      - "scripts/f7_build_input_snapshot.py"
      - "scripts/probe_opera_raw_elf_drift.py"
      - "scripts/f7_prepare_fixed_source.py"
      - "scripts/probe_f7_repaired_double.py"
      - "scripts/f7_cross_container_evidence.py"
      - "scripts/f7_provenance_envelope.py"
      - "scripts/f7_fetch_official_apks.py"
      - "scripts/f7_compare_installed_elf.py"
      - "scripts/f7_correlate_apk_archives.py"
      - "scripts/f7_apk_license_docs.py"
      - "scripts/f7_original_binary_release_gate.py"
      - "scripts/f7_observe_elf_dynamic_transform.py"
      - "scripts/f7_auditwheel_repair_replay.py"
      - "scripts/f7_l12_correlate_actual_elf_operations.py"
      - "scripts/f7_l13_verify_real_repair_passes.py"
      - "scripts/f7_auditwheel_python_trace.py"
      - "scripts/f7_verify_auditwheel_python_trace.py"
      - "scripts/f7_trace_real_patchelf.py"
      - "scripts/f7_verify_patchelf_trace.py"
      - "scripts/f7_probe_official_edge_openssl.py"
      - "tests/test_f7_auditwheel_repair_replay.py"
      - "tests/test_f7_observe_elf_dynamic_transform.py"
      - "scripts/f7_apk_multi_gzip.py"
      - "scripts/f7_consolidate_elf_matrix.py"
      - "scripts/f7_generate_sbom.py"
      - "scripts/f7_elf_license_matrix.py"
      - "scripts/f7_native_size_scope.py"
      - "scripts/f7_alpine_secdb_candidates.py"
      - "scripts/probe_f7_native_driver_scope.py"
      - "scripts/compare_opera_native_inventories.py"
      - "tests/test_f7_repaired_double.py"
      - "custom_components/weather_router/opera_native_package.py"
      - "custom_components/weather_router/opera_cog_tiles.py"
      - "custom_components/weather_router/opera_frame_cache.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp314-musl-wheel-feasibility:
    name: "Alpine 3.24 / CP314 / x86-64 source build, auditwheel and clean native renderer"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: "Read-only checkout of public WR test mirror"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Build native candidate in a FIRST isolated fresh digest-pinned container"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f7-wheelhouse/first" "$RUNNER_TEMP/f7-wheelhouse/second"
          docker run --rm --pull=always --platform linux/amd64 \
            --cpus=2 --memory=4g --pids-limit=256 \
            -e GITHUB_ACTIONS=true -e WR_OPERA_ISOLATED_CI=1 -e WR_F7_APK_ORIGIN_FETCH=1 \
            -e WR_F7_IMAGE_DIGEST="sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6" \
            -v "$PWD:/wr:ro" \
            -v "$RUNNER_TEMP/f7-wheelhouse/first:/wheelhouse" \
            -w /wr "alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6" \
            sh scripts/ci_opera_musl_wheel_prototype.sh build

      - name: "Independently build native candidate in a SECOND fresh digest-pinned container"
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=always --platform linux/amd64 \
            --cpus=2 --memory=4g --pids-limit=256 \
            -e GITHUB_ACTIONS=true -e WR_OPERA_ISOLATED_CI=1 \
            -e WR_F7_IMAGE_DIGEST="sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6" \
            -v "$PWD:/wr:ro" \
            -v "$RUNNER_TEMP/f7-wheelhouse/second:/wheelhouse" \
            -w /wr "alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6" \
            sh scripts/ci_opera_musl_wheel_prototype.sh build

      - name: "Compare exact repaired wheels, inputs and 101-ELF inventories"
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/f7-wheelhouse"
          python scripts/probe_f7_repaired_double.py \
            "$ROOT/first/repaired/rasterio-1.5.2-cp314-cp314-musllinux_1_2_x86_64.whl" \
            "$ROOT/second/repaired/rasterio-1.5.2-cp314-cp314-musllinux_1_2_x86_64.whl" \
            > "$ROOT/f7-separate-containers-repaired-comparison.json"
          python scripts/f7_cross_container_evidence.py \
            "$ROOT/first/f7-build-inputs-unapproved.json" \
            "$ROOT/second/f7-build-inputs-unapproved.json" \
            "$ROOT/f7-separate-containers-repaired-comparison.json" \
            > "$ROOT/f7-independent-build-evidence.json"
          python scripts/compare_opera_native_inventories.py \
            "$ROOT/first/f7-native-inventory.json" \
            "$ROOT/second/f7-native-inventory.json" \
            > "$ROOT/f7-independent-members-unapproved.json"
          cp "$ROOT/first/f7-native-inventory.json" "$ROOT/f7-native-inventory.json"
          cp "$ROOT/first/f7-native-apk-license-candidates.json" "$ROOT/f7-native-apk-license-candidates.json"
          cp "$ROOT/first/f7-build-inputs-unapproved.json" "$ROOT/f7-build-inputs-unapproved.json"
          cp "$ROOT/first/f7-fixed-source-unapproved.json" "$ROOT/f7-fixed-source-unapproved.json"
          cp "$ROOT/first/f7-raw-elf-drift-unapproved.json" "$ROOT/f7-raw-elf-drift-unapproved.json"
          cp "$ROOT/first/f7-repaired-double-unapproved.json" "$ROOT/f7-repaired-double-unapproved.json"
          cp "$ROOT/first/f7-auditwheel-replay-unapproved.json" "$ROOT/f7-auditwheel-replay-unapproved.json"
          cp "$ROOT/first/f7-l12-observed-elf-chains-unapproved.json" "$ROOT/f7-l12-observed-elf-chains-unapproved.json"
          cp "$ROOT/first/f7-l13-verified-pass-elf-edges-unapproved.json" "$ROOT/f7-l13-verified-pass-elf-edges-unapproved.json"
          cp "$ROOT/first/f7-patchelf-trace-summary-unapproved.json" "$ROOT/f7-patchelf-trace-summary-unapproved.json"
          cp "$ROOT/first/f7-patchelf-operations-unapproved.jsonl" "$ROOT/f7-patchelf-operations-unapproved.jsonl"
          cp "$ROOT/first/f7-auditwheel-python-operations-unapproved.jsonl" "$ROOT/f7-auditwheel-python-operations-unapproved.jsonl"
          cp "$ROOT/first/f7-auditwheel-python-summary-unapproved.json" "$ROOT/f7-auditwheel-python-summary-unapproved.json"
          cp "$ROOT/first/f7-cyclonedx-unapproved.json" "$ROOT/f7-cyclonedx-unapproved.json"
          cp "$ROOT/first/f7-sbom-quality-unapproved.json" "$ROOT/f7-sbom-quality-unapproved.json"
          cp "$ROOT/first/f7-native-size-scope-unapproved.json" "$ROOT/f7-native-size-scope-unapproved.json"
          cp "$ROOT/first/f7-101-elf-license-matrix-unapproved.md" "$ROOT/f7-101-elf-license-matrix-unapproved.md"
          cp "$ROOT/first/f7-secdb-candidates-unapproved.json" "$ROOT/f7-secdb-candidates-unapproved.json"
          cp "$ROOT/first/f7-official-apks-unapproved.json" "$ROOT/f7-official-apks-unapproved.json"
          cp "$ROOT/first/f7-openssl-edge-cross-branch-unapproved.json" "$ROOT/f7-openssl-edge-cross-branch-unapproved.json"
          cp "$ROOT/first/f7-original-elf-comparison-unapproved.json" "$ROOT/f7-original-elf-comparison-unapproved.json"
          cp "$ROOT/first/f7-elf-dynamic-observation-unapproved.json" "$ROOT/f7-elf-dynamic-observation-unapproved.json"
          cp "$ROOT/first/f7-apk-member-correlation-unapproved.json" "$ROOT/f7-apk-member-correlation-unapproved.json"
          cp "$ROOT/first/f7-original-binary-release-gate-unapproved.json" "$ROOT/f7-original-binary-release-gate-unapproved.json"
          cp "$ROOT/first/f7-apk-license-docs-unapproved.json" "$ROOT/f7-apk-license-docs-unapproved.json"
          cp "$ROOT/first/f7-101-elf-original-origin-license-matrix-unapproved.md" "$ROOT/f7-101-elf-original-origin-license-matrix-unapproved.md"
          # Cross-bind actual 101 native ELF hashes, SPDX-candidate evidence,
          # pinned OCI input, secdb status and the one Wheel SHA. Unsigned;
          # this is NEVER a production provenance attestation or an approval.
          python scripts/f7_provenance_envelope.py \
            "$ROOT" "$ROOT/f7-provenance-unapproved.json"
          python - "$ROOT/f7-independent-build-evidence.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["ha_installation"]=="BLOCKED"
          assert r["distribution"]=="BLOCKED"
          print("F7 TWO FRESH CONTAINERS:",r["status"],
                "same exact image",r["same_pinned_image_manifest_digest"],
                "same APK installed set",r["same_apk_installed_database_and_package_versions"],
                "repaired SHA equal",r["same_repaired_wheel_sha256"],
                "not provenance/license/security cleared")
          PY

      - name: "Verify bundled GDAL/PROJ and WR CoG→PNG in a THIRD minimal musl container"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f7-wheelhouse/runtime-evidence"
          docker run --rm --pull=always --platform linux/amd64 \
            --cpus=2 --memory=4g --pids-limit=256 \
            -e GITHUB_ACTIONS=true -e WR_OPERA_ISOLATED_CI=1 \
            -v "$PWD:/wr:ro" \
            -v "$RUNNER_TEMP/f7-wheelhouse/first:/wheelhouse:ro" \
            -v "$RUNNER_TEMP/f7-wheelhouse/runtime-evidence:/runtime-evidence" \
            -w /wr "alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6" \
            sh scripts/ci_opera_musl_wheel_prototype.sh verify

      - name: "Archive ONLY non-binary SHA/ELF/license candidate inventory"
        uses: actions/upload-artifact@v4
        with:
          name: f7-cp314-musl-inventory-and-license-candidates-not-approved
          path: |
            ${{ runner.temp }}/f7-wheelhouse/f7-native-inventory.json
            ${{ runner.temp }}/f7-wheelhouse/f7-native-apk-license-candidates.json
            ${{ runner.temp }}/f7-wheelhouse/f7-build-inputs-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-raw-elf-drift-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-fixed-source-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-repaired-double-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-auditwheel-replay-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-l12-observed-elf-chains-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-l13-verified-pass-elf-edges-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-patchelf-trace-summary-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-patchelf-operations-unapproved.jsonl
            ${{ runner.temp }}/f7-wheelhouse/f7-auditwheel-python-operations-unapproved.jsonl
            ${{ runner.temp }}/f7-wheelhouse/f7-auditwheel-python-summary-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-separate-containers-repaired-comparison.json
            ${{ runner.temp }}/f7-wheelhouse/f7-independent-build-evidence.json
            ${{ runner.temp }}/f7-wheelhouse/f7-independent-members-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-cyclonedx-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-sbom-quality-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-native-size-scope-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-101-elf-license-matrix-unapproved.md
            ${{ runner.temp }}/f7-wheelhouse/f7-secdb-candidates-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-provenance-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-official-apks-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-openssl-edge-cross-branch-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-original-elf-comparison-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-elf-dynamic-observation-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-apk-member-correlation-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-original-binary-release-gate-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-apk-license-docs-unapproved.json
            ${{ runner.temp }}/f7-wheelhouse/f7-101-elf-original-origin-license-matrix-unapproved.md
            ${{ runner.temp }}/f7-wheelhouse/runtime-evidence/f7-native-driver-scope-unapproved.json
          if-no-files-found: error
          retention-days: 7

      - name: "Explicit no-install and no-distribution boundary"
        if: always()
        shell: bash
        run: |
          echo "F7 WHEEL PROTOTYPE: All package operations happened in disposable GitHub Actions Alpine containers."
          echo "No wheels are uploaded, published, committed or installed on any user Home Assistant host."
          echo "Even a green job is a PROTOTYPE, NOT HA ABI/load/update/license/OPERA original/HA-REAL approval."
          echo "WR manifest requirements=[], provider and OPERA HTTP endpoint remain unchanged."
