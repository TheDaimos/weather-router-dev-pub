name: OPERA HA Raster-Abhaengigkeiten – ABI und Laufzeit

on:
  push:
    branches:
      - "feature/p7-010-global-concurrency-2026-10-16"
    paths:
      - ".github/workflows/opera-ha-wheel-audit.yml"
      - "scripts/probe_opera_raster_runtime.py"
      - "custom_components/weather_router/opera_cog_tiles.py"
      - "tests/test_opera_cog_render_pixels.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musllinux-wheel-matrix:
    name: "HA Wheel-Verfuegbarkeit CP${{ matrix.py_abi }} / ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.13", py_abi: "313", arch: "x86_64" }
          - { python: "3.13", py_abi: "313", arch: "aarch64" }
          - { python: "3.14", py_abi: "314", arch: "x86_64" }
          - { python: "3.14", py_abi: "314", arch: "aarch64" }
    steps:
      - name: pip als reines plattformuebergreifendes Metadaten-Werkzeug
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freigegebene und neue Rasterio-Wheels mit Positiv- und Negativbefund pruefen
        shell: bash
        env:
          TARGET_PYTHON: ${{ matrix.python }}
          TARGET_ABI: ${{ matrix.py_abi }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "ACHTUNG: pip download auf Ubuntu ist KEIN musllinux-Import/HA-Runtime-Test."
          mkdir -p "${RUNNER_TEMP}/wr-wheel-probe"
          summary="${GITHUB_STEP_SUMMARY}"
          printf '### HA musllinux_1_2_%s / CP%s – Verfuegbarkeit, kein Runtime-PASS\n\n' "$TARGET_ARCH" "$TARGET_ABI" >> "$summary"
          printf '| Kandidat | Ergebnis |\n|---|---|\n' >> "$summary"
          failed=0
          # First probe the frozen F13 baseline; then any newer 1.x release,
          # without silently replacing the tested runtime dependency.
          for spec in 'numpy==2.3.5' 'Pillow==12.3.0' 'rasterio==1.5.0' 'rasterio>=1.5,<2'; do
            slug="${spec//[^a-zA-Z0-9]/_}"
            destination="${RUNNER_TEMP}/wr-wheel-probe/${slug}"
            mkdir -p "$destination"
            if python -m pip download \
              --isolated --disable-pip-version-check --no-cache-dir \
              --index-url https://pypi.org/simple \
              --extra-index-url https://wheels.home-assistant.io/musllinux-index/ \
              --only-binary=:all: --no-deps \
              --platform "musllinux_1_2_${TARGET_ARCH}" \
              --python-version "$TARGET_PYTHON" \
              --implementation cp --abi "cp${TARGET_ABI}" \
              --dest "$destination" "$spec"; then
              wheel_count=$(find "$destination" -maxdepth 1 -name '*.whl' | wc -l)
              if [ "$wheel_count" -gt 0 ]; then
                printf '| `%s` | Wheel vorhanden: `%s` |\n' "$spec" "$(basename "$(find "$destination" -maxdepth 1 -name '*.whl' -print -quit)")" >> "$summary"
              else
                printf '| `%s` | FEHLER: pip erfolgreich, aber kein Wheel |\n' "$spec" >> "$summary"
                failed=1
              fi
            else
              printf '| `%s` | KEIN KOMPATIBLES WHEEL |\n' "$spec" >> "$summary"
              echo "::warning::Kein musllinux_1_2_${TARGET_ARCH} / CP${TARGET_ABI} Wheel: $spec"
              if [[ "$spec" != 'rasterio==1.5.0' ]]; then
                failed=1
              fi
            fi
          done
          printf '\nWheels sind keine Laufzeit-/GDAL-/PROJ-, ABI- oder HA-Freigabe.\n' >> "$summary"
          if [ "$failed" -ne 0 ]; then
            echo "::error::HA Wheel-Gate nicht bestanden: mindestens eine benoetigte Komponente oder neuere Rasterio-Alternative fehlt fuer musllinux_1_2_${TARGET_ARCH} CP${TARGET_ABI}"
            exit 1
          fi
          echo "HA WHEEL-VERFUEGBARKEIT: baseline NumPy/Pillow und ein Rasterio >=1.5,<2 vorhanden; HA-REAL-PASS weiterhin OFFEN."

  native-import-and-synthetic-pixels:
    name: "Linux-glibc echter Import/CoG-Render Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Oeffentlichen Quellstand auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: NUR Binaerpakete installieren, keine lokale Kompilierung
        run: python -m pip install --only-binary=:all: "numpy==2.3.5" "Pillow==12.3.0" "rasterio>=1.5,<2"
      - name: GDAL/PROJ/NumPy/Pillow tatsaechlich importieren
        run: |
          python - <<'PY'
          import json,platform
          import numpy,rasterio,PIL
          from rasterio.warp import reproject
          print(json.dumps({"python":platform.python_version(),"libc":platform.libc_ver(),
              "rasterio":rasterio.__version__,"gdal":rasterio.__gdal_version__,
              "proj":rasterio.__proj_version__,"numpy":numpy.__version__,"pillow":PIL.__version__}))
          PY
      - name: F13 Realfunktion synthetisch und ohne Skip pruefen
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover("tests",pattern="test_opera_cog_render_pixels.py")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun < 2 or result.skipped or not result.wasSuccessful():
              raise SystemExit("F13 Pixel-Regression FAIL oder SKIP")
          PY
      - name: Laufzeit-, CPU- und RSS-Probe mit synthetischem CoG
        run: python scripts/probe_opera_raster_runtime.py
