name: OPERA Rasterbibliotheken - Home Assistant Wheel-Pruefung

on:
  push:
    branches:
      - "feature/p7-010-global-concurrency-2026-10-16"
    paths:
      - ".github/workflows/opera-ha-wheel-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-availability:
    name: "HA musllinux CP${{ matrix.abi }} / ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
        abi: ["313", "314"]
    steps:
      - name: Python installieren - nur Pruefcontainer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: HA musllinux Raster-Wheels mit Versionsalternativen pruefen
        shell: bash
        run: |
          set -euo pipefail
          echo "HA-WHEEL-PROBE: nur oeffentliche Wheel-Verfuegbarkeit; KEIN HA-Import- oder Realtest."
          mkdir -p "${RUNNER_TEMP}/opera-ha-wheels"
          failures=0
          py_version="3.${{ matrix.abi }}"
          py_version="${py_version/3.313/3.13}"
          py_version="${py_version/3.314/3.14}"
          for dependency in "numpy==2.3.5" "Pillow==12.3.0" "rasterio==1.5.0" "rasterio>=1.5,<2"; do
            destination="${RUNNER_TEMP}/opera-ha-wheels/${dependency//[^a-zA-Z0-9]/_}"
            mkdir -p "$destination"
            echo "HA-WHEEL-PROBE: CP${{ matrix.abi }} / ${{ matrix.arch }} / ${dependency}"
            if python -m pip download \
                --index-url https://pypi.org/simple \
                --extra-index-url https://wheels.home-assistant.io/musllinux-index/ \
                --only-binary=:all: \
                --no-deps --no-cache-dir \
                --platform "musllinux_1_2_${{ matrix.arch }}" \
                --python-version "$py_version" \
                --implementation cp \
                --abi "cp${{ matrix.abi }}" \
                --dest "$destination" "${dependency}"; then
              echo "HA-WHEEL-PROBE VERFUEGBAR: ${dependency}"
              find "$destination" -type f -name '*.whl' -printf '%f\n'
            else
              echo "::warning::Kein Fertigpaket CP${{ matrix.abi }} / musllinux_1_2_${{ matrix.arch }}: ${dependency}"
              if [[ "$dependency" != "rasterio==1.5.0" ]]; then
                failures=1
              fi
            fi
          done
          if [ "${failures}" -ne 0 ]; then
            echo "::error::Kein vollstaendiger kompatibler Wheel-Satz fuer CP${{ matrix.abi }} / musllinux_1_2_${{ matrix.arch }}. Native HA-Tests bleiben OFFEN."
            exit 1
          fi
          echo "Wheel-Metadaten-Test bestanden; dies ist KEIN Installations- oder HA-REAL-PASS."

  native-import:
    name: "Linux glibc Raster-Import und synthetische Kachel CP${{ matrix.python }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Oeffentlichen Quellstand holen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Binaerpakete ohne eigenen Build installieren
        run: python -m pip install --only-binary=:all: "numpy==2.3.5" "Pillow==12.3.0" "rasterio>=1.5,<2"

      - name: GDAL/PROJ/Rasterio/NumPy/Pillow importieren
        run: |
          python - <<'PY'
          import json, platform, numpy, rasterio, PIL
          from rasterio.warp import reproject
          print(json.dumps(dict(python=platform.python_version(),libc=platform.libc_ver(),
              numpy=numpy.__version__,rasterio=rasterio.__version__,
              gdal=rasterio.__gdal_version__,proj=rasterio.__proj_version__,
              pillow=PIL.__version__)))
          PY

      - name: F13 CoG-Renderfunktion und Bildpunkte ohne Skip testen
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover("tests",pattern="test_opera_cog_render_pixels.py")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun < 2 or result.skipped or not result.wasSuccessful():
              raise SystemExit("F13 Pixeltest FEHLER/SKIP")
          PY

      - name: Synthetische CoG-Laufzeit CPU und RSS messen
        run: python scripts/probe_opera_raster_runtime.py
