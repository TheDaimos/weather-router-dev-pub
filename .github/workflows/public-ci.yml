name: WeatherRouter Public DEV - Pruefung

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Moon dependencies
        run: python -m pip install astronomy-engine==2.1.19 timezonefinder==8.2.0 voluptuous tzdata
      - name: Moon Engine and WebSocket tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_moon*.py' -v

      - name: Oeffentlichen Dateibestand pruefen
        if: always()
        run: |
          mkdir -p ci-results
          set -o pipefail
          python tests/wr_public_distribution_guard.py 2>&1 | tee ci-results/distribution-guard.log

      - name: Python-Tests
        if: always()
        run: |
          mkdir -p ci-results
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee ci-results/unittest.log

      - name: WeatherRouter-Struktur pruefen
        if: always()
        run: |
          mkdir -p ci-results
          set -o pipefail
          python scripts/verify_m2_structure.py 2>&1 | tee ci-results/structure.log

      - name: JavaScript-Syntax pruefen
        if: always()
        shell: bash
        run: |
          find custom_components/weather_router/frontend -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Git-Export-Oberflaeche pruefen
        if: always()
        run: |
          mkdir -p ci-results
          set -o pipefail
          node tests/test_git_export_frontend.cjs 2>&1 | tee ci-results/git-export-frontend.log

      - name: CI-Protokolle archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-router-public-ci-${{ matrix.python-version }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30
