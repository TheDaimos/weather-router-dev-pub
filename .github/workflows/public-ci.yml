name: WeatherRouter Public DEV - Pruefung

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Oeffentlichen Dateibestand pruefen
        run: python tests/wr_public_distribution_guard.py

      - name: P7-010 Raster-Mosaik-Vertrag (oeffentliche Nachholpruefung)
        run: python -m unittest discover -s tests -p 'test_p7_010_raster_mosaic_*.py' -v

      - name: Raster-Bildtest-Bibliotheken installieren (nur oeffentliche CI)
        run: |
          python -m pip install --only-binary=:all: "numpy==2.3.5" "rasterio==1.5.0" "Pillow==12.3.0" "aiohttp>=3.11,<4"
          python - <<'PY'
          import numpy, rasterio, PIL
          print("F13 Rasterumgebung:", numpy.__version__, rasterio.__version__, PIL.__version__)
          PY

      - name: F13 echte Renderfunktion und Bildpunkte pruefen – Skip verboten
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_opera_cog_render_pixels.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun < 2 or result.skipped or not result.wasSuccessful():
              raise SystemExit(f"F13 PIXEL FAIL: tests={result.testsRun} skipped={len(result.skipped)} failures={len(result.failures)} errors={len(result.errors)}")
          print(f"F13 PIXEL PASS: {result.testsRun} tests, no skipped tests")
          PY

      - name: Python-Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: WeatherRouter-Struktur pruefen
        run: python scripts/verify_m2_structure.py

      - name: JavaScript-Syntax pruefen
        shell: bash
        run: |
          find custom_components/weather_router/frontend -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Git-Export-Oberflaeche pruefen
        run: node tests/test_git_export_frontend.cjs

      - name: Oeffentliches Integrationspaket erstellen und verifizieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r -9 dist/WeatherRouter_Public_DEV_CI.zip custom_components/weather_router
          (cd dist && sha256sum WeatherRouter_Public_DEV_CI.zip > WeatherRouter_Public_DEV_CI.zip.sha256)
          (cd dist && sha256sum -c WeatherRouter_Public_DEV_CI.zip.sha256)
          unzip -t -q dist/WeatherRouter_Public_DEV_CI.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path("custom_components/weather_router")
          expected = {p.as_posix() for p in root.rglob("*") if p.is_file()}
          with ZipFile("dist/WeatherRouter_Public_DEV_CI.zip") as archive:
              members = {n for n in archive.namelist() if not n.endswith("/")}
          if members != expected:
              raise SystemExit(f"Integrationspaket weicht von oeffentlichen Quellen ab: fehlend={len(expected-members)}, zusaetzlich={len(members-expected)}")
          print(f"Oeffentliches Integrationspaket OK: {len(members)} Dateien")
          PY

      - name: Oeffentliche Integrationspaket-Pruefartefakte
        uses: actions/upload-artifact@v4
        with:
          name: WeatherRouter-Public-DEV-CI
          path: |
            dist/WeatherRouter_Public_DEV_CI.zip
            dist/WeatherRouter_Public_DEV_CI.zip.sha256
          if-no-files-found: error
          retention-days: 7
