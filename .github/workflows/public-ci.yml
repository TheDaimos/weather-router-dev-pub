name: WeatherRouter Public DEV - Pruefung

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Oeffentlichen Dateibestand pruefen
        run: python tests/wr_public_distribution_guard.py

      - name: P7-010 Raster-Mosaik-Vertrag (oeffentliche Nachholpruefung)
        run: python -m unittest discover -s tests -p 'test_p7_010_raster_mosaic_*.py' -v

      - name: Python-Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: WeatherRouter-Struktur pruefen
        run: python scripts/verify_m2_structure.py

      - name: JavaScript-Syntax pruefen
        shell: bash
        run: |
          find custom_components/weather_router/frontend -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Git-Export-Oberflaeche pruefen
        run: node tests/test_git_export_frontend.cjs
