      <stop offset="0" stop-color="#07111C"/>
      <stop offset="1" stop-color="#091A2C"/>
    </linearGradient>
    <linearGradient id="stroke" x1="7" y1="7" x2="57" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7C16A"/>
      <stop offset="0.45" stop-color="#8C5D17"/>
      <stop offset="1" stop-color="#F0CF75"/>
